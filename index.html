<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f07818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinPal">
<title>FinPal v4</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f6f7;
color:#17231e;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
max-width:900px;
margin:auto;
padding:18px 15px 100px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px
}

.logo{
font-size:30px;
font-weight:900
}

.logo span{
color:#f07818
}

.date{
font-size:12px;
color:#777
}

.hero{
background:linear-gradient(135deg,#b94708,#f07818);
color:white;
padding:22px;
border-radius:24px;
margin-bottom:15px
}

.hero small{
opacity:.85
}

.balance{
font-size:38px;
font-weight:900;
margin:7px 0 18px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.stat{
background:#ffffff28;
padding:11px;
border-radius:13px
}

.stat b{
display:block;
margin-top:4px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}

.card{
background:#fff;
border:1px solid #e4e8e5;
border-radius:18px;
padding:17px;
box-shadow:0 6px 20px #00000009
}

.card h2{
font-size:17px;
margin:0 0 13px
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:11px 0;
border-bottom:1px solid #eee
}

.row:last-child{
border-bottom:0
}

.muted{
font-size:13px;
color:#777
}

.account{
padding:12px 0;
border-bottom:1px solid #eee
}

.account:last-child{
border-bottom:0
}

.account-top{
display:flex;
justify-content:space-between
}

.account-actions{
margin-top:8px;
display:flex;
gap:6px
}

button{
border:0;
border-radius:12px;
padding:11px 14px;
background:#f07818;
color:white;
font-weight:750;
font-size:14px
}

.dark{
background:#18342b
}

.danger{
background:#c43d2f
}

.small{
padding:7px 9px;
font-size:12px
}

.positive{
color:#16824f
}

.negative{
color:#c74624
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:20;
align-items:flex-end
}

.modal.active{
display:flex
}

.sheet{
background:white;
width:100%;
max-width:600px;
margin:auto;
padding:20px;
border-radius:24px 24px 0 0;
max-height:90vh;
overflow:auto
}

input,select{
width:100%;
padding:13px;
margin:7px 0 12px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
background:white
}

.actions{
display:flex;
gap:8px
}

.actions button{
flex:1
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #ddd;
padding:9px;
display:flex;
gap:7px;
z-index:10
}

.bottom button{
flex:1
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr
}

.balance{
font-size:34px
}

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
Fin<span>Pal</span>
</div>

<div class="date" id="date"></div>

</header>


<section class="hero">

<small>Net Varlık</small>

<div class="balance" id="netWorth">
₺0,00
</div>

<div class="stats">

<div class="stat">
<small>Varlık</small>
<b id="assets">₺0,00</b>
</div>

<div class="stat">
<small>Borç</small>
<b id="liabilities">₺0,00</b>
</div>

<div class="stat">
<small>Bu Ay</small>
<b id="monthlyNet">₺0,00</b>
</div>

</div>

</section>


<div class="grid">


<section class="card">

<h2>💳 Hesaplar</h2>

<div id="accounts">
<div class="muted">
Henüz hesap yok.
</div>
</div>

<button onclick="openAccount()">
+ Hesap Ekle
</button>

<button class="dark" onclick="openAccountTransfer()">
↔ Transfer
</button>

</section>


<section class="card">

<h2>📊 Bu Ay</h2>

<div class="row">
<span>Gelir</span>
<b id="monthIncome">₺0</b>
</div>

<div class="row">
<span>Gider</span>
<b id="monthExpense">₺0</b>
</div>

<div class="row">
<span>Tasarruf</span>
<b id="monthSaving">₺0</b>
</div>

</section>


<section class="card">

<h2>📦 Zarflar</h2>

<div id="envelopes">
<div class="muted">
Mevcut zarflar burada görünecek.
</div>
</div>
<div style="margin-top:12px">

<button onclick="openEnvelope()">
+ Zarf Ekle
</button>

<button class="dark" onclick="openTransfer()">
↔ Zarf Transferi
</button>

</div>
</section>


<section class="card">

<h2>🧾 Son İşlemler</h2>

<div id="transactions">
<div class="muted">
Henüz işlem yok.
</div>
</div>

<button onclick="openTransaction()">
+ İşlem Ekle
</button>

</section>

</div>

</div>


<!-- ACCOUNT MODAL -->

<div class="modal" id="accountModal">

<div class="sheet">

<h2>💳 Hesap Ekle</h2>

<input
id="accountName"
placeholder="Hesap adı">

<select id="accountType">

<option value="asset">🏦 Banka</option>
<option value="cash">💵 Nakit</option>
<option value="credit">💳 Kredi Kartı</option>
<option value="investment">📈 Yatırım</option>
<option value="debt">🧾 Borç</option>
<option value="other">📋 Diğer</option>

</select>

<input
id="accountBalance"
type="number"
inputmode="decimal"
placeholder="Mevcut bakiye">

<div class="actions">

<button class="dark"
onclick="closeModals()">
İptal
</button>

<button onclick="addAccount()">
Kaydet
</button>

</div>

</div>

</div>


<!-- ACCOUNT TRANSFER -->

<div class="modal" id="accountTransferModal">

<div class="sheet">

<h2>↔ Hesap Transferi</h2>

<label>Kaynak hesap</label>

<select id="transferFrom"></select>

<label>Hedef hesap</label>

<select id="transferTo"></select>

<input
id="accountTransferAmount"
type="number"
inputmode="decimal"
placeholder="Transfer tutarı">

<div class="actions">

<button class="dark"
onclick="closeModals()">
İptal
</button>

<button onclick="transferAccount()">
Transfer Et
</button>

</div>

</div>

</div>


<!-- TRANSACTION -->

<div class="modal" id="transactionModal">

<div class="sheet">

<h2>🧾 Yeni İşlem</h2>

<select id="transactionType">

<option value="expense">
💸 Gider
</option>

<option value="income">
💰 Gelir
</option>

</select>

<input
id="transactionAmount"
type="number"
inputmode="decimal"
placeholder="Tutar">

<input
id="transactionDescription"
placeholder="Açıklama">

<select id="transactionCategory">

<option>Market</option>
<option>Faturalar</option>
<option>Ulaşım</option>
<option>Yemek</option>
<option>Eğlence</option>
<option>Sağlık</option>
<option>Alışveriş</option>
<option>Maaş</option>
<option>Diğer</option>

</select>

<select id="transactionAccount">
<option value="">
Hesap seç
</option>
</select>

<select id="transactionEnvelope">
<option value="">
Zarf seç
</option>
</select>

<div class="actions">

<button class="dark"
onclick="closeModals()">
İptal
</button>

<button onclick="addTransaction()">
Kaydet
</button>

</div>

</div>

</div>


<script>

const money = n =>
new Intl.NumberFormat("tr-TR",{
style:"currency",
currency:"TRY"
}).format(Number(n)||0);


function loadData(){

try{

const saved =
localStorage.getItem("finpalData");

if(saved){

const parsed=JSON.parse(saved);

return {

accounts:Array.isArray(parsed.accounts)
?parsed.accounts:[],

transactions:Array.isArray(parsed.transactions)
?parsed.transactions:[],

envelopes:Array.isArray(parsed.envelopes)
?parsed.envelopes:[],

budgets:Array.isArray(parsed.budgets)
?parsed.budgets:[]

};

}

}catch(e){

console.error(e);

}

return {
accounts:[],
transactions:[],
envelopes:[],
budgets:[]
};

}


let data=loadData();


function save(){

localStorage.setItem(
"finpalData",
JSON.stringify(data)
);

render();

}


function accountIsLiability(account){

return account.type==="credit" ||
account.type==="debt";

}


function calculateAssets(){

return data.accounts
.filter(x=>!accountIsLiability(x))
.reduce(
(sum,x)=>sum+Number(x.balance||0),
0
);

}


function calculateLiabilities(){

return data.accounts
.filter(x=>accountIsLiability(x))
.reduce(
(sum,x)=>sum+Math.abs(Number(x.balance||0)),
0
);

}


function render(){

const assets=calculateAssets();

const liabilities=calculateLiabilities();

const netWorth=
assets-liabilities;


const now=new Date();

const month=
now.getMonth();

const year=
now.getFullYear();


let income=0;
let expense=0;


data.transactions.forEach(x=>{

const d=new Date(x.date);

if(
d.getMonth()===month &&
d.getFullYear()===year
){

if(x.type==="income")
income+=Number(x.amount||0);

if(x.type==="expense")
expense+=Number(x.amount||0);

}

});


document.getElementById("assets")
.innerText=money(assets);

document.getElementById("liabilities")
.innerText=money(liabilities);

document.getElementById("netWorth")
.innerText=money(netWorth);

document.getElementById("monthIncome")
.innerText=money(income);

document.getElementById("monthExpense")
.innerText=money(expense);

document.getElementById("monthSaving")
.innerText=money(income-expense);

document.getElementById("monthlyNet")
.innerText=money(income-expense);


renderAccounts();

renderEnvelopes();

renderTransactions();

updateSelects();

}


function renderAccounts(){

const el=
document.getElementById("accounts");


if(!data.accounts.length){

el.innerHTML=
'<div class="muted">Henüz hesap yok.</div>';

return;

}


el.innerHTML=
data.accounts.map((x,i)=>{

const liability=
accountIsLiability(x);

const value=
Number(x.balance||0);

return`

<div class="account">

<div class="account-top">

<div>

<strong>
${escapeHTML(x.name||"Hesap")}
</strong>

<br>

<small>
${accountTypeName(x.type)}
</small>

</div>

<strong class="${liability?"negative":"positive"}">

${money(value)}

</strong>

</div>


<div class="account-actions">

<button
class="small"
onclick="editAccount(${i})">

✏️ Düzenle

</button>

<button
class="small danger"
onclick="deleteAccount(${i})">

🗑️ Sil

</button>

</div>

</div>

`;

}).join("");

}


function accountTypeName(type){

const names={

asset:"Banka",

cash:"Nakit",

credit:"Kredi Kartı",

investment:"Yatırım",

debt:"Borç",

other:"Diğer"

};

return names[type]||"Diğer";

}


function renderEnvelopes(){

const el=
document.getElementById("envelopes");


if(!data.envelopes.length){

el.innerHTML=
'<div class="muted">Henüz zarf yok.</div>';

return;

}


el.innerHTML=
data.envelopes.map(x=>{

const budget=
Number(x.budget||0);

const spent=
Number(x.spent||0);

const remaining=
budget-spent;

const percent=
budget>0
?Math.min(
Math.max((spent/budget)*100,0),
100
)
:0;


return`

<div>

<div class="row">

<span>
<strong>
${escapeHTML(x.name||"Zarf")}
</strong>

<br>

<small>
Harcanan:
${money(spent)}
</small>

</span>

<strong>
${money(remaining)}
</strong>

</div>

<div style="
height:7px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:6px 0 10px">

<div style="
height:100%;
width:${percent}%;
background:#f07818;
border-radius:20px">
</div>

</div>

</div>

`;

}).join("");

}


function renderTransactions(){

const el=
document.getElementById("transactions");


if(!data.transactions.length){

el.innerHTML=
'<div class="muted">Henüz işlem yok.</div>';

return;

}


el.innerHTML=
data.transactions
.slice()
.reverse()
.slice(0,10)
.map(x=>`

<div class="row">

<span>

<strong>
${escapeHTML(
x.description||
x.category||
"İşlem"
)}
</strong>

<br>

<small>
${escapeHTML(x.category||"")}
</small>

</span>

<strong class="${
x.type==="income"
?"positive"
:"negative"
}">

${x.type==="income"?"+":"-"}
${money(x.amount)}

</strong>

</div>

`).join("");

}


function updateSelects(){

const accountOptions=
data.accounts.map(x=>
`<option value="${x.id}">
${escapeHTML(x.name)}
</option>`
).join("");


document.getElementById(
"transactionAccount"
).innerHTML=
'<option value="">Hesap seç</option>'+
accountOptions;


document.getElementById(
"transferFrom"
).innerHTML=
accountOptions;


document.getElementById(
"transferTo"
).innerHTML=
accountOptions;


const envelopeOptions=
data.envelopes.map(x=>
`<option value="${x.id}">
${escapeHTML(x.name)}
</option>`
).join("");


document.getElementById(
"transactionEnvelope"
).innerHTML=
'<option value="">Zarf seç</option>'+
envelopeOptions;

}


function addAccount(){

const name=
document.getElementById(
"accountName"
).value.trim();


const type=
document.getElementById(
"accountType"
).value;


const balance=
parseFloat(
document.getElementById(
"accountBalance"
).value
)||0;


if(!name){

alert("Hesap adı gir.");

return;

}


data.accounts.push({

id:Date.now(),

name,

type,

balance

});


save();

document.getElementById(
"accountName"
).value="";

document.getElementById(
"accountBalance"
).value="";

closeModals();

}


function editAccount(index){

const account=data.accounts[index];


const name=prompt(
"Hesap adı:",
account.name
);


if(name===null)return;


const balance=parseFloat(
prompt(
"Mevcut bakiye:",
account.balance
)
);


if(isNaN(balance)){

alert("Geçerli bakiye gir.");

return;

}


account.name=name;

account.balance=balance;


save();

}


function deleteAccount(index){

if(
!confirm(
"Bu hesabı silmek istediğine emin misin?"
)
)return;


data.accounts.splice(index,1);

save();

}


function transferAccount(){

const fromId=
Number(
document.getElementById(
"transferFrom"
).value
);


const toId=
Number(
document.getElementById(
"transferTo"
).value
);


const amount=
parseFloat(
document.getElementById(
"accountTransferAmount"
).value
);


if(fromId===toId){

alert(
"Kaynak ve hedef hesap aynı olamaz."
);

return;

}


if(!amount||amount<=0){

alert(
"Geçerli bir tutar gir."
);

return;

}


const from=
data.accounts.find(
x=>x.id===fromId
);


const to=
data.accounts.find(
x=>x.id===toId
);


if(!from||!to)return;


if(accountIsLiability(from)){

from.balance+=amount;

}else{

from.balance-=amount;

}


if(accountIsLiability(to)){

to.balance-=amount;

}else{

to.balance+=amount;

}


data.transactions.push({

id:Date.now(),

type:"transfer",

amount,

description:
from.name+
" → "+
to.name,

category:"Hesap Transferi",

accountId:from.id,

targetAccountId:to.id,

date:new Date().toISOString()

});


save();

document.getElementById(
"accountTransferAmount"
).value="";

closeModals();

}


function addTransaction(){

    const type=
        document.getElementById(
            "transactionType"
        ).value;

    const amount=
        parseFloat(
            document.getElementById(
                "transactionAmount"
            ).value
        );

    const description=
        document.getElementById(
            "transactionDescription"
        ).value.trim();

    const category=
        document.getElementById(
            "transactionCategory"
        ).value;

    const accountId=
        document.getElementById(
            "transactionAccount"
        ).value;

    let envelopeId=
        document.getElementById(
            "transactionEnvelope"
        ).value;


    if(!amount || amount<=0){

        alert("Geçerli bir tutar gir.");

        return;

    }


    /*
       Bütçeye bağlı zarfı otomatik bul
    */

    if(
        type==="expense" &&
        !envelopeId &&
        data.budgets
    ){

        const budget=
            data.budgets.find(
                x=>
                    x.category===category &&
                    x.month===currentMonth() &&
                    x.envelopeId
            );


        if(budget){

            envelopeId=
                String(budget.envelopeId);

        }

    }


    const transaction={

        id:Date.now(),

        type,

        amount,

        description,

        category,

        accountId,

        envelopeId,

        date:new Date().toISOString()

    };


    data.transactions.push(
        transaction
    );


    /*
       Hesap bakiyesini güncelle
    */

    if(accountId){

        const account=
            data.accounts.find(
                x=>x.id==accountId
            );


        if(account){

            if(
                accountIsLiability(account)
            ){

                if(type==="expense")
                    account.balance+=amount;

                else
                    account.balance-=amount;

            }else{

                if(type==="income")
                    account.balance+=amount;

                else
                    account.balance-=amount;

            }

        }

    }


    /*
       Gideri zarfa işle
    */

    if(
        type==="expense" &&
        envelopeId
    ){

        const envelope=
            data.envelopes.find(
                x=>String(x.id)===String(envelopeId)
            );


        if(envelope){

            envelope.spent=
                Number(envelope.spent||0)+amount;

        }

    }


    save();


    document.getElementById(
        "transactionAmount"
    ).value="";


    document.getElementById(
        "transactionDescription"
    ).value="";


    closeModals();

}


const transaction={

id:Date.now(),

type,

amount,

description,

category,

accountId,

envelopeId,

date:new Date().toISOString()

};


data.transactions.push(transaction);


if(accountId){

const account=
data.accounts.find(
x=>x.id==accountId
);


if(account){

if(accountIsLiability(account)){

if(type==="expense")
account.balance+=amount;

else
account.balance-=amount;

}else{

if(type==="income")
account.balance+=amount;

else
account.balance-=amount;

}

}

}


if(
type==="expense" &&
envelopeId
){

const envelope=
data.envelopes.find(
x=>x.id==envelopeId
);

if(envelope){

envelope.spent=
Number(envelope.spent||0)+amount;

}

}


save();

document.getElementById(
"transactionAmount"
).value="";

document.getElementById(
"transactionDescription"
).value="";

closeModals();

}


function openAccount(){

document.getElementById(
"accountModal"
).classList.add("active");

}


function openAccountTransfer(){

if(data.accounts.length<2){

alert(
"Transfer için en az iki hesap gerekli."
);

return;

}

document.getElementById(
"accountTransferModal"
).classList.add("active");

}


function openTransaction(){

document.getElementById(
"transactionModal"
).classList.add("active");

}


function closeModals(){

document
.querySelectorAll(".modal")
.forEach(x=>
x.classList.remove("active")
);

}


function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


document.getElementById("date")
.innerText=
new Date().toLocaleDateString(
"tr-TR",
{
day:"numeric",
month:"long",
year:"numeric"
}
);


render();
/* =========================
   FINPAL V5 - BUTCE MODULU
   ========================= */

if(!data.budgets){
    data.budgets=[];
}

function currentMonth(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function getBudgetSpent(category,month){
    return data.transactions
        .filter(x=>{
            if(x.type!=="expense") return false;
            if(x.category!==category) return false;

            const d=new Date(x.date);
            const m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

            return m===month;
        })
        .reduce((sum,x)=>sum+Number(x.amount||0),0);
}

function budgetStatus(percent){

    if(percent>=100){
        return {
            text:"Bütçe aşıldı",
            className:"negative"
        };
    }

    if(percent>=75){
        return {
            text:"Dikkat",
            className:"negative"
        };
    }

    return {
        text:"Normal",
        className:"positive"
    };
}

function addBudget(){
    const category=prompt("Bütçe kategorisi:\n\nÖrn: Market");
    if(!category) return;

    const amount=parseFloat(prompt("Aylık bütçe tutarı:"));
    if(!amount || amount<=0){
        alert("Geçerli bir tutar gir.");
        return;
    }

    let envelopeId="";

    if(data.envelopes && data.envelopes.length){
        const list=data.envelopes
            .map((e,i)=>(i+1)+". "+e.name)
            .join("\n");

        const choice=prompt(
            "Bu bütçeyi hangi zarfa bağlayalım?\n\n"+
            list+
            "\n\n0 = Zarf bağlama"
        );

        const n=parseInt(choice);

        if(n>0 && data.envelopes[n-1]){
            envelopeId=data.envelopes[n-1].id;
        }
    }

    const month=currentMonth();

    const existing=data.budgets.find(
        x=>x.category===category && x.month===month
    );

    if(existing){
        existing.amount=amount;
        existing.envelopeId=envelopeId;
    }else{
        data.budgets.push({
            id:Date.now(),
            category:category,
            amount:amount,
            month:month,
            envelopeId:envelopeId
        });
    }



function deleteBudget(index){

    if(
        !confirm(
            "Bu bütçeyi silmek istediğine emin misin?"
        )
    ) return;

    data.budgets.splice(index,1);

    save();

    renderBudgets();

}

function editBudget(index){

    const budget=
        data.budgets[index];

    const amount=
        parseFloat(
            prompt(
                "Yeni bütçe tutarı:",
                budget.amount
            )
        );

    if(!amount || amount<=0){
        alert("Geçerli bir tutar gir.");
        return;
    }

    budget.amount=amount;

    save();

    renderBudgets();

}

function renderBudgets(){

    const container=
        document.getElementById(
            "budgetList"
        );

    if(!container) return;

    const month=currentMonth();

    const budgets=
        data.budgets.filter(
            x=>x.month===month
        );

    if(!budgets.length){

        container.innerHTML=`
            <div class="muted">
                Bu ay henüz bütçe oluşturulmadı.
            </div>
        `;

        return;
    }

    container.innerHTML=
        budgets.map((budget,index)=>{

            const spent=
                getBudgetSpent(
                    budget.category,
                    month
                );

            const remaining=
                Number(budget.amount)-spent;

            const percent=
                Number(budget.amount)>0
                ?(spent/Number(budget.amount))*100
                :0;

            const safePercent=
                Math.min(
                    Math.max(percent,0),
                    100
                );

            const status=
                budgetStatus(percent);
const linkedEnvelope=data.envelopes
    ? data.envelopes.find(
        e=>String(e.id)===String(budget.envelopeId)
      )
    : null;
            const realIndex=
                data.budgets.indexOf(
                    budget
                );

            return`

            <div class="account">

                <div class="account-top">

                    <div>

                        <strong>
                            ${escapeHTML(
                                budget.category
                            )}
                        </strong>

                        <br>

                        <small>
    Planlanan:
    ${money(budget.amount)}
</small>

<br>

<small>
    📦 Zarf:
    ${
        linkedEnvelope
        ? escapeHTML(linkedEnvelope.name)
        : "Bağlı değil"
    }
</small>

                    </div>

                    <strong class="${
                        remaining<0
                        ?"negative"
                        :"positive"
                    }">

                        ${money(remaining)}

                    </strong>

                </div>

                <div style="
                    height:8px;
                    background:#eee;
                    border-radius:20px;
                    overflow:hidden;
                    margin:9px 0;
                ">

                    <div style="
                        height:100%;
                        width:${safePercent}%;
                        background:#f07818;
                        border-radius:20px;
                    "></div>

                </div>

                <div class="row">

                    <small>
                        Harcanan:
                        ${money(spent)}
                    </small>

                    <small class="${
                        status.className
                    }">

                        ${Math.round(percent)}%
                        ·
                        ${status.text}

                    </small>

                </div>

                <div class="account-actions">

                    <button
                        class="small"
                        onclick="editBudget(${realIndex})">

                        ✏️ Düzenle

                    </button>

                    <button
                        class="small danger"
                        onclick="deleteBudget(${realIndex})">

                        🗑️ Sil

                    </button>

                </div>

            </div>

            `;

        }).join("");

}


/* Bütçe kartını ana sayfaya ekle */

function createBudgetCard(){

    if(
        document.getElementById(
            "budgetCard"
        )
    ) return;

    const grid=
        document.querySelector(".grid");

    if(!grid) return;

    const card=
        document.createElement("section");

    card.className="card";

    card.id="budgetCard";

    card.innerHTML=`

        <h2>📊 Aylık Bütçe</h2>

        <div id="budgetList">

            <div class="muted">
                Bu ay henüz bütçe oluşturulmadı.
            </div>

        </div>

        <button onclick="addBudget()">
            + Bütçe Ekle
        </button>

    `;

    grid.insertBefore(
        card,
        grid.firstElementChild
    );

    renderBudgets();

}


/* Ana render fonksiyonuna bağla */

const oldRender=render;

render=function(){

    oldRender();

    createBudgetCard();

    renderBudgets();

};
function openEnvelope(){

    const name=prompt(
        "Zarf adı:\n\nÖrn: Market"
    );

    if(!name) return;

    const budget=parseFloat(
        prompt("Zarf bütçesi:")
    );

    if(!budget || budget<=0){

        alert("Geçerli bir bütçe gir.");

        return;
    }

    if(!data.envelopes){
        data.envelopes=[];
    }

    data.envelopes.push({

        id:Date.now(),

        name:name,

        budget:budget,

        spent:0

    });

    save();

    render();

}


function openTransfer(){

    if(!data.envelopes ||
       data.envelopes.length<2){

        alert(
            "Zarf transferi için en az 2 zarf gerekli."
        );

        return;
    }

    const names=
        data.envelopes
        .map(
            (x,i)=>
            (i+1)+". "+x.name
        )
        .join("\n");

    const fromNumber=
        parseInt(
            prompt(
                "Kaynak zarfı seç:\n\n"+
                names
            )
        );

    const toNumber=
        parseInt(
            prompt(
                "Hedef zarfı seç:\n\n"+
                names
            )
        );

    if(
        !fromNumber ||
        !toNumber ||
        fromNumber===toNumber
    ){

        alert(
            "Geçerli ve farklı iki zarf seç."
        );

        return;
    }

    const amount=parseFloat(
        prompt("Transfer tutarı:")
    );

    if(!amount || amount<=0){

        alert(
            "Geçerli bir tutar gir."
        );

        return;
    }

    const from=
        data.envelopes[fromNumber-1];

    const to=
        data.envelopes[toNumber-1];

    const available=
        Number(from.budget||0)-
        Number(from.spent||0);

    if(amount>available){

        alert(
            "Kaynak zarfta yeterli para yok."
        );

        return;
    }

    from.budget-=amount;

    to.budget+=amount;

    save();

    render();

    alert(
        "Zarf transferi tamamlandı."
    );

}
</script>
