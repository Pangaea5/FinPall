<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinPal</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#f5f6f7;
    color:#17231e;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 16px 40px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:30px;
    font-weight:900;
}

.logo span{
    color:#f07818;
}

.date{
    color:#777;
    font-size:13px;
}

/* BALANCE */

.balance-card{
    background:linear-gradient(135deg,#b94708,#f07818);
    color:white;
    padding:24px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    margin-bottom:18px;
}

.balance-title{
    opacity:.85;
    font-size:14px;
}

.balance{
    font-size:40px;
    font-weight:900;
    margin:8px 0 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:rgba(255,255,255,.17);
    padding:12px;
    border-radius:14px;
}

.stat-title{
    font-size:12px;
    opacity:.85;
}

.stat-value{
    font-size:16px;
    font-weight:800;
    margin-top:4px;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:20px;
    border:1px solid #e5e8e6;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.card h2{
    font-size:18px;
    margin-bottom:14px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:none;
}

.muted{
    color:#777;
    font-size:13px;
}

/* BUTTON */

.button{
    border:none;
    background:#f07818;
    color:white;
    font-size:15px;
    font-weight:700;
    padding:12px 16px;
    border-radius:13px;
    margin-top:12px;
}

.button:active{
    transform:scale(.97);
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:16px 14px 35px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .balance{
        font-size:35px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Fin<span>Pal</span>
        </div>

        <div class="date" id="date"></div>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div class="balance-title">
            Toplam Bakiye
        </div>

        <div class="balance">
            ₺0,00
        </div>

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    Gelir
                </div>

                <div class="stat-value">
                    ₺0,00
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Gider
                </div>

                <div class="stat-value">
                    ₺0,00
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Net
                </div>

                <div class="stat-value">
                    ₺0,00
                </div>

            </div>

        </div>

    </div>


    <!-- CARDS -->

    <div class="grid">


        <!-- BUDGET -->

        <div class="card">

            <h2>📊 Bütçe</h2>

            <div class="row">
                <span>Bu ay ayrılan</span>
                <strong>₺0,00</strong>
            </div>

            <div class="row">
                <span>Harcanan</span>
                <strong>₺0,00</strong>
            </div>

            <div class="row">
                <span>Kalan</span>
                <strong>₺0,00</strong>
            </div>

        </div>


        <!-- ACCOUNTS -->

        <div class="card">

            <h2>💳 Hesaplar</h2>

            <p class="muted">
                Henüz hesap eklenmedi.
            </p>

            <button class="button"
            onclick="alert('Hesap ekleme özelliğini sonraki aşamada ekleyeceğiz.')">

                + Hesap Ekle

            </button>

        </div>


        <!-- ENVELOPES -->

        <div class="card">

            <h2>📦 Zarflar</h2>

            <p class="muted">
                Paranızı kategorilere ayırın.
            </p>

            <button class="button"
            onclick="alert('Zarf sistemi sonraki aşamada aktif olacak.')">

                + Zarf Ekle

            </button>

        </div>


        <!-- TRANSACTIONS -->

        <div class="card">

            <h2>🧾 Son İşlemler</h2>

            <p class="muted">
                Henüz işlem bulunmuyor.
            </p>

        </div>


    </div>

</div>


<script>

const today = new Date();

document.getElementById("date").innerText =
    today.toLocaleDateString("tr-TR",{
        day:"numeric",
        month:"long",
        year:"numeric"
    });

</script>

</body>
</html>
